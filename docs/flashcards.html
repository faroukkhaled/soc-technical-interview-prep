<title>SOC interview flashcards</title>
<style>body{font:16px system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}.card{border:1px solid #ccc;border-radius:10px;padding:1.5rem;min-height:140px;cursor:pointer}
.tag{color:#666;font-size:13px}button,select{font:inherit;padding:.4rem .8rem;margin:.3rem .3rem .3rem 0}</style>
<h1>SOC interview flashcards</h1>
<select id="dom"><option value="">all domains</option><option value="banking">banking</option><option value="behavioral">behavioral</option><option value="cloud">cloud</option><option value="detection">detection</option><option value="fundamentals">fundamentals</option><option value="ir">ir</option><option value="linux">linux</option><option value="network">network</option><option value="web">web</option><option value="windows">windows</option></select> <button id="shuffle">Shuffle</button> <span id="count"></span>
<div class="card" id="card"></div><p><button id="prev">Prev</button><button id="flip">Show answer</button><button id="next">Next</button></p>
<script>
const DATA=[{"q": "Why do banks need a SOC?", "a": "Banks are high-value targets with strict regulation. The SOC monitors for fraud and account takeover, insider misuse, malware and phishing against staff and customers, and provides evidence for compliance.", "d": "banking", "l": 1}, {"q": "How would you detect account takeover in online banking?", "a": "Chain the signals: login from a new device or country, failed attempts beforehand, password reset or MFA change, new payee added, then a transfer much larger than the customer's history. Individually weak signals become critical in sequence.", "d": "banking", "l": 2}, {"q": "What is credential stuffing and how is it different from brute force?", "a": "Credential stuffing tries leaked username and password pairs against many accounts, relying on password reuse. Brute force tries many passwords against one account. Stuffing shows many distinct accounts failing from one or several sources, with a low failure count per account.", "d": "banking", "l": 2}, {"q": "What is structuring (smurfing)?", "a": "Splitting a large amount into several transfers just under a reporting threshold to avoid scrutiny. Detect repeated amounts just below the limit from one customer or into one beneficiary in a short window.", "d": "banking", "l": 2}, {"q": "What is a money mule and what pattern do they create?", "a": "An account that receives and quickly forwards illicit funds. Typical pattern: many incoming payments from unrelated sources (fan-in), then fast withdrawal or onward transfer (fan-out).", "d": "banking", "l": 2}, {"q": "What insider threat signals would a bank SOC monitor?", "a": "Mass viewing of customer records, access outside working hours or to accounts without a case, access to VIP or staff accounts, large exports or uploads, USB use, and access by staff who have given notice. Handle discreetly with HR and compliance.", "d": "banking", "l": 2}, {"q": "What regulations or standards come up in banking security?", "a": "PCI DSS for card data, ISO 27001 for management systems, SWIFT Customer Security Programme for payment messaging, data protection law such as GDPR or local equivalents, and central bank cyber regulations. Check which apply in your country.", "d": "banking", "l": 2}, {"q": "What is the difference between SMS OTP, TOTP and phishing-resistant MFA?", "a": "SMS OTP can be intercepted (SIM swap) or phished. TOTP codes from an app are better but still phishable in real time. FIDO2 or passkeys bind authentication to the real site, so they resist phishing.", "d": "banking", "l": 2}, {"q": "Tell me about a project you did.", "a": "Use the STAR shape: goal, what you built, one detection or decision in detail, what you learned. For example, the AD and Sysmon lab: you built a Sigma-style engine that runs 19 rules, scored them against a labelled simulation for missed detections and false positives, and wrote tests. Be honest that the data is synthetic and be ready to explain the code.", "d": "behavioral", "l": 1}, {"q": "How do you stay current with threats?", "a": "Name real sources you use: vendor advisories and CISA, DFIR and threat intel blogs, CVE feeds, practising in labs, and communities. Give a recent example and what you changed because of it.", "d": "behavioral", "l": 1}, {"q": "Describe a time you made a mistake and how you handled it.", "a": "Pick a real, small-to-moderate mistake. Own it, explain the immediate fix, and describe the process change that prevents it. Do not blame others.", "d": "behavioral", "l": 1}, {"q": "How do you prioritise when five alerts arrive at once?", "a": "By severity and confidence, asset criticality and user role, whether money or data is moving, and the SLA. Handle active compromise and critical assets first, ask for help when the queue exceeds capacity, and document what was deferred and why.", "d": "behavioral", "l": 2}, {"q": "How do you explain a security incident to a non-technical manager?", "a": "Start with impact and current status, then what you did, what you need decided, and the next update time. Avoid jargon, separate confirmed facts from assumptions, and give a short timeline.", "d": "behavioral", "l": 2}, {"q": "Why do you want to work in a SOC?", "a": "Give a specific reason: you enjoy investigation and detection work, and you have already built labs and written detections. Link it to the employer's environment (for example protecting customers and money in a bank).", "d": "behavioral", "l": 1}, {"q": "What is your experience with offensive security and how does it help a defender?", "a": "Offensive experience helps you think like the attacker: you know what artefacts techniques leave and where defences are weak. Describe how you would turn an attack technique into a detection and test it with a purple-team exercise. Mention only certifications you actually hold.", "d": "behavioral", "l": 2}, {"q": "What is MITRE ATT\u0026CK used for?", "a": "A knowledge base of adversary tactics (the goal) and techniques (the method). SOCs map detections to techniques, find coverage gaps, plan hunts, and describe attacker behaviour in a shared language.", "d": "detection", "l": 1}, {"q": "What is Sigma?", "a": "A vendor-neutral YAML format for detection rules (selections, conditions, log source, ATT\u0026CK tags) that converts into queries for Splunk, Elastic, Sentinel and others. It makes rules shareable and testable.", "d": "detection", "l": 2}, {"q": "How do you build and test a new detection?", "a": "Start from a hypothesis or technique, find the telemetry, write the rule, generate the attack in a lab (Atomic Red Team), confirm it fires, run it against historical data to estimate false positives, tune with allow-lists and context, document triage steps, and review its performance regularly.", "d": "detection", "l": 3}, {"q": "How do you reduce alert fatigue?", "a": "Remove or tune noisy rules, add asset and user context for severity, group related alerts into incidents, automate enrichment, track false positive rate per rule, and retire rules nobody acts on.", "d": "detection", "l": 2}, {"q": "What is threat hunting and how is it different from alert triage?", "a": "Hunting is proactive and hypothesis driven: you search for attacker behaviour that did not alert. Triage is reactive: you investigate an alert that fired. Good hunts end as new detections.", "d": "detection", "l": 2}, {"q": "Give an example hunt for living-off-the-land activity.", "a": "Hypothesis: attackers use built-in binaries to avoid malware detection. Query process creation for certutil with urlcache or decode, mshta or regsvr32 with remote URLs, and rare parent and child pairs compared against a baseline (for example Office or WMI starting cmd and PowerShell). Review hits with the user and host context.", "d": "detection", "l": 3}, {"q": "What is the difference between signature, anomaly and behaviour-based detection?", "a": "Signatures match known-bad patterns (precise but evaded easily). Anomaly detection flags deviation from a baseline (finds new things, noisy). Behaviour-based detection looks for attacker actions such as credential access or persistence, which are harder to change.", "d": "detection", "l": 2}, {"q": "How would you measure how good your SOC is?", "a": "Mean time to detect and respond, mean time to acknowledge, false positive rate per rule, ATT\u0026CK coverage, percentage of alerts triaged within SLA, escalation accuracy, and findings from purple team exercises.", "d": "detection", "l": 3}, {"q": "What is the difference between an event, an alert and an incident?", "a": "An event is any logged occurrence. An alert is an event or pattern that a rule flags for review. An incident is a confirmed security event that needs a response. Most events never become alerts and most alerts are not incidents.", "d": "fundamentals", "l": 1}, {"q": "Explain the CIA triad with a banking example.", "a": "Confidentiality: only the customer and authorised staff see an account (attack: data theft). Integrity: balances and transfers cannot be altered undetected (attack: tampering with a payment instruction). Availability: online banking is up when customers need it (attack: DDoS or ransomware).", "d": "fundamentals", "l": 1}, {"q": "What is a false positive and a false negative, and which is worse?", "a": "A false positive is an alert on benign activity. A false negative is a real attack that raised no alert. False negatives are usually worse because the attack goes unseen, but a flood of false positives causes alert fatigue, which leads to false negatives in practice. Tune thresholds, add allow-lists and context, and measure rule performance.", "d": "fundamentals", "l": 1}, {"q": "What is defence in depth?", "a": "Several independent layers of control (network segmentation, endpoint protection, identity controls, logging, backups) so that one failure does not mean compromise. It combines prevent, detect and respond controls.", "d": "fundamentals", "l": 1}, {"q": "What is the principle of least privilege and where does it matter most for a SOC?", "a": "Give accounts only the access needed for their job. It limits the blast radius of a stolen credential. The SOC watches privileged and service accounts closely: admin group changes, logons outside normal hours, and service accounts used interactively.", "d": "fundamentals", "l": 1}, {"q": "What is the difference between threat, vulnerability and risk?", "a": "A threat is something that can cause harm (a ransomware group). A vulnerability is a weakness (an unpatched server). Risk is the likelihood that a threat exploits a vulnerability multiplied by the impact.", "d": "fundamentals", "l": 1}, {"q": "What is a SIEM and what does it do?", "a": "A SIEM collects logs, normalises them to a common schema, correlates events across sources, raises alerts and supports search, dashboards and retention for investigations and compliance. A SOAR adds automated playbooks on top.", "d": "fundamentals", "l": 1}, {"q": "What is the difference between IDS and IPS?", "a": "An IDS watches a copy of traffic (passive) and alerts. An IPS sits inline and can block. Inline placement risks outages from false positives, so IPS rules are tuned more carefully.", "d": "fundamentals", "l": 1}, {"q": "What is an IOC versus an IOA?", "a": "An IOC is evidence of compromise that is often atomic and short-lived (a file hash, IP or domain). An IOA describes attacker behaviour, such as Office spawning PowerShell. IOAs survive tooling changes, IOCs are cheap to evade.", "d": "fundamentals", "l": 2}, {"q": "What is the Pyramid of Pain?", "a": "David Bianco's model of how much it hurts an adversary when you detect each indicator type: hash values (trivial), IP addresses, domain names, network and host artefacts, tools, and TTPs (tough). Detections at the top force attackers to change behaviour.", "d": "fundamentals", "l": 2}, {"q": "Explain the phases of incident response.", "a": "NIST 800-61: preparation; detection and analysis; containment, eradication and recovery; post-incident activity (lessons learned). The older SANS model splits containment, eradication and recovery into three steps.", "d": "ir", "l": 1}, {"q": "Walk me through how you triage an alert.", "a": "Read the rule and context, validate against raw logs, check the asset and user, look for related activity, decide true or false positive, set severity, then contain or escalate and document the decision and evidence.", "d": "ir", "l": 1}, {"q": "How do you handle a suspected compromised host?", "a": "Isolate it from the network (do not power it off, to keep memory), capture volatile data and disk images, scope the activity and other affected hosts, remove persistence, reset exposed credentials, and rebuild from a known-good image when trust is lost.", "d": "ir", "l": 2}, {"q": "What is the order of volatility?", "a": "Collect the most volatile first: CPU registers and cache, memory, network connections and routing tables, running processes, disk, remote logs, and archival media.", "d": "ir", "l": 2}, {"q": "What is chain of custody and why does it matter?", "a": "A documented record of who collected, handled and stored each piece of evidence, with hashes to prove it was not altered. Without it the evidence may be rejected in legal or disciplinary proceedings.", "d": "ir", "l": 2}, {"q": "How do you respond to a phishing email reported by a user?", "a": "Check sender and headers (SPF, DKIM, DMARC), detonate URLs and attachments in a sandbox, find everyone who received or clicked it, block the sender, domain and URL, remove it from mailboxes, reset credentials of anyone who entered them, and add IOCs to detections.", "d": "ir", "l": 1}, {"q": "A user's account shows a login from a new country. What do you do?", "a": "Check for impossible travel, known VPN use, new device and MFA outcome. If suspicious, revoke sessions, force a password reset and MFA re-registration, review mailbox rules and recent activity such as forwarding or payee changes, and contact the user on a trusted channel.", "d": "ir", "l": 2}, {"q": "What is ransomware response in the first hour?", "a": "Isolate affected hosts and segments, disable compromised accounts, protect backups, identify the strain and scope (shadow copy deletion, mass file renames), preserve evidence, notify management, legal and regulators as required, and decide on payment only through the formal crisis process.", "d": "ir", "l": 3}, {"q": "What goes in an incident report?", "a": "Summary, timeline, affected systems and data, root cause, detection and response actions, indicators, impact, and recommendations. Keep facts separate from assumptions.", "d": "ir", "l": 1}, {"q": "Which Linux logs do you check first for a suspicious SSH login?", "a": "/var/log/auth.log (Debian) or /var/log/secure (RHEL) for Accepted and Failed password lines, plus last, lastb and journalctl -u ssh. Look for brute force followed by a success and logins from new sources.", "d": "linux", "l": 1}, {"q": "What are common Linux persistence methods?", "a": "Cron jobs, systemd services and timers, SSH authorized_keys, shell profile files (.bashrc), ld.so.preload, new users or sudoers entries, and SUID binaries.", "d": "linux", "l": 2}, {"q": "What is SQL injection and how do you spot it in logs?", "a": "Untrusted input changes a database query. In web logs look for quotes, UNION SELECT, comments, sleep() and error responses in parameters. Prevent with prepared statements, input validation and least-privilege database accounts.", "d": "web", "l": 1}, {"q": "What is XSS and what are its types?", "a": "Cross-site scripting runs attacker script in a victim's browser. Stored (saved on the server), reflected (in the request) and DOM-based. Prevent with output encoding, a Content Security Policy and HttpOnly cookies.", "d": "web", "l": 1}, {"q": "What is the difference between authentication and authorisation, and what is IDOR?", "a": "Authentication proves who you are, authorisation decides what you can do. IDOR is an authorisation flaw where changing an identifier in a request (account_id=1001 to 1002) exposes someone else's data.", "d": "web", "l": 2}, {"q": "What is the OWASP Top 10?", "a": "A regularly updated list of the most critical web application risks, such as broken access control, cryptographic failures and injection. It is an awareness document and a common baseline for testing.", "d": "web", "l": 1}, {"q": "How do you detect risky activity in cloud or SaaS accounts?", "a": "Review sign-in and audit logs for impossible travel, legacy authentication, MFA changes, new OAuth app consent, mailbox forwarding rules, and API key or role creation. Alert on privileged role changes and disabled logging.", "d": "cloud", "l": 2}, {"q": "What are symmetric and asymmetric encryption, and what is hashing?", "a": "Symmetric uses one shared key (AES, fast). Asymmetric uses a key pair (RSA, ECC) for key exchange and signatures. A hash is a one-way fixed-size fingerprint (SHA-256) used for integrity, and passwords should be stored with a slow salted hash such as bcrypt or Argon2.", "d": "fundamentals", "l": 1}, {"q": "Describe the TCP three-way handshake and what a SYN scan looks like.", "a": "Client sends SYN, server replies SYN-ACK, client sends ACK. A SYN scan sends SYN to many ports and never completes the handshake (half-open), so logs show many SYNs and RSTs from one source to many ports or hosts.", "d": "network", "l": 1}, {"q": "Which ports and protocols should every analyst know?", "a": "22 SSH, 25 SMTP, 53 DNS, 80 HTTP, 88 Kerberos, 110 POP3, 123 NTP, 135 RPC, 139 and 445 SMB, 143 IMAP, 389 LDAP, 443 HTTPS, 636 LDAPS, 1433 MSSQL, 3306 MySQL, 3389 RDP, 5985 and 5986 WinRM.", "d": "network", "l": 1}, {"q": "What is beaconing and how do you find it?", "a": "Malware calling home on a timer. Group connections by source, destination and process, compute the gaps, and look for low variance (a small coefficient of variation) with small jitter, plus low data volume and an uncommon destination. False positives: update checkers, monitoring agents, NTP.", "d": "network", "l": 2}, {"q": "How can DNS be abused by attackers and how do you detect it?", "a": "DNS tunnelling encodes data in subdomains, DGAs generate many random domains, and TXT records can carry commands. Detect long or high-entropy labels, many unique subdomains under one domain, high NXDOMAIN rates, unusual TXT volume, and hosts bypassing the internal resolver.", "d": "network", "l": 2}, {"q": "What is the difference between a proxy, a firewall and a WAF?", "a": "A firewall filters by address, port and state (layers 3 and 4, or more in next-gen firewalls). A proxy brokers client requests and can inspect and log web use. A WAF protects a web application at layer 7 against attacks like SQL injection and XSS.", "d": "network", "l": 1}, {"q": "What would you look for in a PCAP of a suspected infection?", "a": "Start with conversations and protocol hierarchy, DNS queries, HTTP requests and user agents, TLS server names, and large uploads. Follow streams, export objects, and pull IOCs (IPs, domains, URLs, hashes) to search elsewhere.", "d": "network", "l": 2}, {"q": "How does a man-in-the-middle attack work on a local network, and how do you prevent it?", "a": "ARP spoofing makes victims send traffic to the attacker as if it were the gateway. Prevent with dynamic ARP inspection, port security and 802.1X, and rely on TLS with certificate validation so intercepted traffic is useless.", "d": "network", "l": 2}, {"q": "What is lateral movement and which protocols are involved?", "a": "Moving from one compromised host to others. Common methods: SMB with admin shares and PsExec, RDP, WinRM and PowerShell remoting, WMI and DCOM, scheduled tasks and remote services. Detect with type 3 and type 10 logons from unusual sources, new services (7045), and one account touching many hosts.", "d": "network", "l": 2}, {"q": "Which Windows event IDs do you use most for logon investigations?", "a": "4624 successful logon, 4625 failed logon, 4634 or 4647 logoff, 4648 logon with explicit credentials, 4672 special privileges assigned. Always read the logon type: 2 interactive, 3 network, 10 remote interactive (RDP).", "d": "windows", "l": 1}, {"q": "What do logon types 2, 3, 4, 5, 7, 9, 10 and 11 mean?", "a": "2 interactive (console), 3 network (SMB, mapped drives), 4 batch (scheduled task), 5 service, 7 unlock, 9 NewCredentials (runas /netonly), 10 RemoteInteractive (RDP), 11 CachedInteractive (cached domain credentials). Type 3 from one source to many hosts suggests lateral movement. Type 10 from the internet is a red flag.", "d": "windows", "l": 2}, {"q": "How would you detect Kerberoasting?", "a": "Event 4769 (Kerberos service ticket request) with ticket encryption type 0x17 (RC4) for user service accounts rather than machine accounts, and many requests from one source in a short time. Reduce noise by excluding krbtgt and accounts ending with $. Mitigate with long random service account passwords or gMSA and AES-only.", "d": "windows", "l": 2}, {"q": "How would you detect DCSync?", "a": "Event 4662 where the properties include the DS-Replication-Get-Changes GUIDs (1131f6aa-9c07-11d1-f79f-00c04fc2dcd2 and 1131f6ad-...) and the subject is not a domain controller machine account. Also watch network traffic: DRSUAPI replication calls from a non-DC.", "d": "windows", "l": 3}, {"q": "What is Pass-the-Hash and what traces does it leave?", "a": "Authenticating with an NTLM hash instead of the password. Traces: 4624 type 3 with NTLM authentication from workstations to servers, logon type 9 with seclogo process on the source, unusual admin accounts across many hosts. Mitigate with LAPS, disabling local admin reuse, Credential Guard and restricting NTLM.", "d": "windows", "l": 2}, {"q": "What is a Golden Ticket and how might you spot one?", "a": "A forged TGT signed with the krbtgt account hash, giving domain-wide access. Signs: service ticket requests (4769) without a preceding TGT request (4768), TGT lifetimes beyond policy, RC4 tickets in an AES environment, accounts that do not exist. Response: reset krbtgt twice.", "d": "windows", "l": 3}, {"q": "How would you investigate a suspicious PowerShell alert?", "a": "Check the parent process and user, read the full command line, decode any -EncodedCommand (UTF-16LE base64), look at script block log 4104, find network connections (Sysmon 3) and files written (Sysmon 11), then check persistence (Run keys, scheduled tasks, WMI) and other hosts with the same pattern.", "d": "windows", "l": 2}, {"q": "Name common Windows persistence mechanisms.", "a": "Run and RunOnce registry keys, scheduled tasks, new services, the Startup folder, WMI event subscriptions, DLL search order hijacking, Winlogon helper keys, and new local or domain accounts. Sysmon 13 (registry), 11 (file), 19-21 (WMI), and Security 4698 and 7045 cover most.", "d": "windows", "l": 2}, {"q": "What is Sysmon and which events matter most?", "a": "A Sysinternals service that logs detailed host activity to the Windows event log. Key events: 1 process creation, 3 network connection, 7 image load, 8 CreateRemoteThread, 10 process access (LSASS), 11 file create, 13 registry value set, 19-21 WMI, 22 DNS query.", "d": "windows", "l": 1}, {"q": "How do you detect credential dumping from LSASS?", "a": "Sysmon event 10 where TargetImage is lsass.exe and GrantedAccess includes memory read rights such as 0x1010 or 0x1410, excluding known security tools. Also process creation of procdump with lsass, or rundll32 with comsvcs.dll MiniDump. Mitigate with Credential Guard and LSA protection (RunAsPPL).", "d": "windows", "l": 2}, {"q": "Which event shows the audit log was cleared?", "a": "Security event 1102 means the Security log was cleared. System event 104 covers other logs. Log clearing is defence evasion (T1070.001) and almost never benign on a production host.", "d": "windows", "l": 1}, {"q": "What is Group Policy and why do attackers care?", "a": "Group Policy applies settings to domains, OUs and computers. Whoever can edit a GPO can push scripts, scheduled tasks or security setting changes to many machines at once, which makes it a favourite for ransomware deployment. Monitor GPO edits (5136, 5137) and SYSVOL changes.", "d": "windows", "l": 2}, {"q": "What is the difference between local and domain accounts, and why does LAPS matter?", "a": "Local accounts exist on one machine, domain accounts are managed by AD. If every machine has the same local admin password, one stolen hash gives access everywhere. LAPS gives each machine a unique, rotated local admin password.", "d": "windows", "l": 2}];let list=DATA.slice(),i=0,show=false;
const el=id=>document.getElementById(id);
function render(){const c=list[i];el('count').textContent=(i+1)+' / '+list.length;
 el('card').innerHTML='';const t=document.createElement('div');t.className='tag';t.textContent=c.d+' | level '+c.l;
 const b=document.createElement('p');b.textContent=show?c.a:c.q;b.style.fontWeight=show?'normal':'600';
 el('card').append(t,b);el('flip').textContent=show?'Show question':'Show answer';}
function go(d){i=(i+d+list.length)%list.length;show=false;render()}
el('next').onclick=()=>go(1);el('prev').onclick=()=>go(-1);el('flip').onclick=el('card').onclick=()=>{show=!show;render()};
el('shuffle').onclick=()=>{list.sort(()=>Math.random()-.5);i=0;show=false;render()};
el('dom').onchange=e=>{list=DATA.filter(c=>!e.target.value||c.d===e.target.value);i=0;show=false;render()};
render();
</script>
